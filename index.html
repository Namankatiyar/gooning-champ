<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gooing Championship — Let the Gooning Begin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Geist", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      @keyframes gridShift {
        from { background-position: 0 0, 0 0; }
        to { background-position: 42px 42px, 42px 42px; }
      }

      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(18px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .bg-grid-animated { animation: gridShift 20s linear infinite; }
      .enter-anim { animation: fadeUp 700ms ease-out both; }

      .panel {
        transition: transform 260ms ease, border-color 260ms ease, background-color 260ms ease;
      }
      .panel:hover {
        transform: translateY(-3px);
        border-color: rgba(229, 9, 20, 0.75);
        background-color: rgba(229, 9, 20, 0.08);
      }

      .section-title {
        display: inline-block;
        transition: transform 220ms ease;
      }
      .panel:hover .section-title { transform: translateX(2px); }

      #participants-card li {
        transition: transform 220ms ease, border-color 220ms ease, background-color 220ms ease;
      }
      #participants-card li:hover { transform: translateX(4px); }

      table thead th {
        transition: background-color 220ms ease, color 220ms ease;
      }

      table tbody tr {
        transition: background-color 240ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 240ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      table tbody tr:hover {
        background-color: rgba(229, 9, 20, 0.16);
        box-shadow: inset 2px 0 0 rgba(229, 9, 20, 0.65);
      }

      .points-cell {
        transition: color 220ms ease, opacity 220ms ease;
      }
      tr:hover .points-cell {
        color: #ff4d57;
        opacity: 1;
      }

      .tab-button {
        border: 1px solid rgba(229, 9, 20, 0.35);
        background-color: rgba(255, 255, 255, 0.03);
        color: rgba(244, 244, 245, 0.85);
        transition: background-color 220ms cubic-bezier(0.2, 0.8, 0.2, 1), border-color 220ms cubic-bezier(0.2, 0.8, 0.2, 1), color 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .tab-button:hover {
        border-color: rgba(229, 9, 20, 0.55);
        background-color: rgba(229, 9, 20, 0.14);
        color: rgb(244, 244, 245);
      }
      .tab-button[aria-selected="true"] {
        border-color: rgba(229, 9, 20, 0.75);
        background-color: rgba(229, 9, 20, 0.28);
        color: rgb(244, 244, 245);
      }

      @media (prefers-reduced-motion: reduce) {
        .bg-grid-animated,
        .enter-anim,
        .points-cell,
        .panel,
        #participants-card li,
        table thead th,
        table tbody tr,
        .tab-button {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-black text-zinc-50 antialiased selection:bg-[#E50914]/40">
    <div aria-hidden="true" class="fixed inset-0 -z-10 overflow-hidden">
      <div class="bg-grid-animated absolute inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:42px_42px]"></div>
    </div>

    <main class="enter-anim mx-auto w-full max-w-6xl px-3 py-6 sm:px-6 sm:py-10 lg:px-8">
      <section
        class="rounded-sm border border-[#E50914]/45 bg-gradient-to-br from-[#E50914]/30 via-[#E50914]/12 to-transparent p-5 backdrop-blur-xl sm:p-8 lg:p-10"
      >
        <p class="mb-3 inline-flex rounded-sm border border-[#E50914]/70 bg-[#E50914]/25 px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.16em] text-zinc-100 sm:px-4 sm:text-xs sm:tracking-[0.18em]">
          Friendly Chess Event
        </p>
        <h1 class="text-3xl font-extrabold uppercase tracking-tight text-zinc-100 sm:text-5xl lg:text-6xl">
          Gooing Championship ♟️
        </h1>
        <p class="mt-3 text-base font-medium text-zinc-100 sm:mt-4 sm:text-xl">
          Let the Gooning Begin
        </p>
      </section>

      <section class="mt-5 grid gap-4 md:mt-8 md:grid-cols-3 md:gap-6">
        <article id="participants-card" class="panel rounded-sm border border-[#E50914]/35 bg-black p-4 backdrop-blur-md sm:p-5 md:col-span-1 md:p-6">
          <h2 class="section-title text-xl font-semibold uppercase tracking-wide text-zinc-100">Participants</h2>
          <p class="mt-1 text-sm text-zinc-300/80">Current player list</p>
          <ul id="participants-list" class="mt-4 grid grid-cols-2 gap-2 text-sm text-zinc-100 sm:grid-cols-3 md:grid-cols-1"></ul>
        </article>

        <article class="panel rounded-sm border border-[#E50914]/35 bg-black p-4 backdrop-blur-md sm:p-5 md:col-span-2 md:p-6">
          <h2 class="section-title text-xl font-semibold uppercase tracking-wide text-zinc-100">Tournament Tables</h2>
          <p class="mt-1 text-sm text-zinc-300/80">Switch between fixtures and standings</p>
          <div class="mt-4 flex w-full gap-2" role="tablist" aria-label="Tournament data tabs">
            <button
              type="button"
              id="tab-fixtures"
              class="tab-button flex-1 rounded-sm px-3 py-2.5 text-xs font-semibold uppercase tracking-wide sm:px-4 sm:text-sm"
              role="tab"
              aria-controls="panel-fixtures"
              aria-selected="true"
              data-tab="fixtures"
            >
              Upcoming Matches
            </button>
            <button
              type="button"
              id="tab-standings"
              class="tab-button flex-1 rounded-sm px-3 py-2.5 text-xs font-semibold uppercase tracking-wide sm:px-4 sm:text-sm"
              role="tab"
              aria-controls="panel-standings"
              aria-selected="false"
              data-tab="standings"
            >
              Points Table
            </button>
          </div>

          <section id="panel-fixtures" class="mt-4" role="tabpanel" aria-labelledby="tab-fixtures">
            <div id="fixtures-mobile" class="space-y-3 md:hidden"></div>
            <div class="hidden overflow-x-auto rounded-sm border border-[#E50914]/35 md:block">
              <table class="min-w-full divide-y divide-white/10 text-sm">
                <thead class="bg-[#E50914]/40 text-left text-zinc-100">
                  <tr>
                    <th class="px-3 py-3 font-medium sm:px-4">Date</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Player A</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Player B</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Round</th>
                  </tr>
                </thead>
                <tbody id="fixtures-body" class="divide-y divide-white/10 text-zinc-100/90"></tbody>
              </table>
            </div>
          </section>

          <section id="panel-standings" class="mt-4" role="tabpanel" aria-labelledby="tab-standings" hidden>
            <div id="standings-mobile" class="space-y-3 md:hidden"></div>
            <div class="hidden overflow-x-auto rounded-sm border border-[#E50914]/35 md:block">
              <table class="min-w-full divide-y divide-white/10 text-sm">
                <thead class="bg-[#E50914]/40 text-left text-zinc-100">
                  <tr>
                    <th class="px-3 py-3 font-medium sm:px-4">Rank</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Player</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Played</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Won</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Draw</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Lost</th>
                    <th class="px-3 py-3 font-medium sm:px-4">Points</th>
                  </tr>
                </thead>
                <tbody id="standings-body" class="divide-y divide-white/10 text-zinc-100/90"></tbody>
              </table>
            </div>
          </section>
        </article>
      </section>
    </main>

    <script>
      const tournamentData = {
        participants: [
          "Naman",
          "Aryan",
          "Raghav",
          "Aditya",
          "Shivam",
          "Kunal",
          "Dev",
          "Yash",
          "Sarthak",
          "Manav",
        ],
        fixtures: [
          { date: "18 May", playerA: "Naman", playerB: "Aryan", round: "R1" },
          { date: "18 May", playerA: "Raghav", playerB: "Aditya", round: "R1" },
          { date: "19 May", playerA: "Shivam", playerB: "Kunal", round: "R1" },
          { date: "19 May", playerA: "Dev", playerB: "Yash", round: "R1" },
          { date: "20 May", playerA: "Sarthak", playerB: "Manav", round: "R1" },
        ],
        standings: [
          { rank: 1, player: "Aryan", played: 2, won: 2, draw: 0, lost: 0, points: 6 },
          { rank: 2, player: "Naman", played: 2, won: 1, draw: 1, lost: 0, points: 4 },
          { rank: 3, player: "Aditya", played: 2, won: 1, draw: 0, lost: 1, points: 3 },
          { rank: 4, player: "Raghav", played: 2, won: 0, draw: 1, lost: 1, points: 1 },
          { rank: 5, player: "Yash", played: 1, won: 0, draw: 1, lost: 0, points: 1 },
        ],
      };

      const escapeHtml = (value) =>
        String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      const rowClasses = (index) =>
        index % 2 === 0
          ? "bg-white/5 transition hover:bg-[#E50914]/20"
          : "bg-white/[0.03] transition hover:bg-[#E50914]/20";

      document.getElementById("participants-list").innerHTML = tournamentData.participants
        .map(
          (participant, index) =>
            `<li class="rounded-sm border border-[#E50914]/30 bg-white/5 px-3 py-2 text-center transition hover:border-[#E50914]/70 hover:bg-[#E50914]/20 md:text-left">${index + 1}. ${escapeHtml(participant)}</li>`
        )
        .join("");

      document.getElementById("fixtures-mobile").innerHTML = tournamentData.fixtures
        .map(
          (fixture, index) => `
          <article class="${rowClasses(index)} rounded-sm border border-[#E50914]/30 p-3">
            <div class="flex items-center justify-between gap-3 text-xs uppercase tracking-wide text-zinc-300">
              <span>${escapeHtml(fixture.date)}</span>
              <span>${escapeHtml(fixture.round)}</span>
            </div>
            <p class="mt-2 text-base font-semibold text-zinc-100">${escapeHtml(fixture.playerA)} <span class="text-zinc-400">vs</span> ${escapeHtml(fixture.playerB)}</p>
          </article>`
        )
        .join("");

      document.getElementById("fixtures-body").innerHTML = tournamentData.fixtures
        .map(
          (fixture, index) => `
          <tr class="${rowClasses(index)}">
            <td class="px-3 py-3 sm:px-4">${escapeHtml(fixture.date)}</td>
            <td class="px-3 py-3 sm:px-4">${escapeHtml(fixture.playerA)}</td>
            <td class="px-3 py-3 sm:px-4">${escapeHtml(fixture.playerB)}</td>
            <td class="px-3 py-3 sm:px-4">${escapeHtml(fixture.round)}</td>
          </tr>`
        )
        .join("");

      document.getElementById("standings-mobile").innerHTML = tournamentData.standings
        .map(
          (standing, index) => `
          <article class="${rowClasses(index)} rounded-sm border border-[#E50914]/30 p-3">
            <div class="flex items-center justify-between gap-3">
              <p class="text-base font-semibold text-zinc-100">#${standing.rank} ${escapeHtml(standing.player)}</p>
              <p class="text-lg font-bold text-[#E50914]">${standing.points} pts</p>
            </div>
            <div class="mt-2 grid grid-cols-4 gap-2 text-xs text-zinc-300">
              <p><span class="block text-zinc-400">P</span>${standing.played}</p>
              <p><span class="block text-zinc-400">W</span>${standing.won}</p>
              <p><span class="block text-zinc-400">D</span>${standing.draw}</p>
              <p><span class="block text-zinc-400">L</span>${standing.lost}</p>
            </div>
          </article>`
        )
        .join("");

      document.getElementById("standings-body").innerHTML = tournamentData.standings
        .map(
          (standing, index) => `
          <tr class="${rowClasses(index)}">
            <td class="px-3 py-3 sm:px-4">${standing.rank}</td>
            <td class="px-3 py-3 sm:px-4">${escapeHtml(standing.player)}</td>
            <td class="px-3 py-3 sm:px-4">${standing.played}</td>
            <td class="px-3 py-3 sm:px-4">${standing.won}</td>
            <td class="px-3 py-3 sm:px-4">${standing.draw}</td>
            <td class="px-3 py-3 sm:px-4">${standing.lost}</td>
            <td class="px-3 py-3 font-semibold text-[#E50914] sm:px-4"><span class="points-cell">${standing.points}</span></td>
          </tr>`
        )
        .join("");

      const tabButtons = Array.from(document.querySelectorAll("[data-tab]"));
      const tabPanels = {
        fixtures: document.getElementById("panel-fixtures"),
        standings: document.getElementById("panel-standings"),
      };

      const activateTab = (tabName) => {
        tabButtons.forEach((button) => {
          const isActive = button.dataset.tab === tabName;
          button.setAttribute("aria-selected", isActive ? "true" : "false");
          button.setAttribute("tabindex", isActive ? "0" : "-1");
        });

        Object.entries(tabPanels).forEach(([name, panel]) => {
          panel.hidden = name !== tabName;
        });
      };

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => activateTab(button.dataset.tab));
      });
    </script>
  </body>
</html>
